<?xml version="1.0" encoding="UTF-8"?>
<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Gradient for performance bars -->
    <linearGradient id="performanceGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#10B981;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#059669;stop-opacity:1" />
    </linearGradient>
    
    <!-- Gradient for main elements -->
    <linearGradient id="mainGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D4ED8;stop-opacity:1" />
    </linearGradient>
    
    <!-- Glow effect -->
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge> 
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  
  <!-- Background -->
  <rect width="200" height="200" fill="#F8FAFC"/>
  
  <!-- Main container representing the list view -->
  <rect x="50" y="40" width="100" height="120" rx="12" ry="12" fill="none" stroke="url(#mainGradient)" stroke-width="3"/>
  
  <!-- List items with varying heights (representing dynamic content) -->
  <rect x="60" y="55" width="80" height="8" rx="4" ry="4" fill="url(#mainGradient)" opacity="0.8"/>
  <rect x="60" y="70" width="60" height="8" rx="4" ry="4" fill="url(#mainGradient)" opacity="0.8"/>
  <rect x="60" y="85" width="75" height="8" rx="4" ry="4" fill="url(#mainGradient)" opacity="0.8"/>
  <rect x="60" y="100" width="50" height="8" rx="4" ry="4" fill="url(#mainGradient)" opacity="0.8"/>
  <rect x="60" y="115" width="70" height="8" rx="4" ry="4" fill="url(#mainGradient)" opacity="0.8"/>
  <rect x="60" y="130" width="65" height="8" rx="4" ry="4" fill="url(#mainGradient)" opacity="0.8"/>
  <rect x="60" y="145" width="55" height="8" rx="4" ry="4" fill="url(#mainGradient)" opacity="0.4"/>
  
  <!-- Scroll indicator -->
  <rect x="155" y="50" width="4" height="100" rx="2" ry="2" fill="#E5E7EB"/>
  <rect x="155" y="60" width="4" height="30" rx="2" ry="2" fill="url(#mainGradient)" filter="url(#glow)"/>
  
  <!-- Performance indicators (60fps) -->
  <g transform="translate(20, 170)">
    <text x="0" y="0" font-family="Arial, sans-serif" font-size="10" font-weight="bold" fill="#6B7280">60fps</text>
    <rect x="30" y="-8" width="20" height="4" rx="2" ry="2" fill="url(#performanceGradient)"/>
    <rect x="30" y="-3" width="15" height="4" rx="2" ry="2" fill="url(#performanceGradient)"/>
    <rect x="30" y="2" width="18" height="4" rx="2" ry="2" fill="url(#performanceGradient)"/>
  </g>
  
  <!-- Momentum/physics indicator -->
  <g transform="translate(160, 30)" opacity="0.7">
    <path d="M 0 0 Q 10 -5 20 0 Q 30 5 40 0" stroke="url(#mainGradient)" stroke-width="2" fill="none"/>
    <circle cx="40" cy="0" r="3" fill="url(#mainGradient)"/>
  </g>
  
  <!-- Touch/swipe gesture indicator -->
  <g transform="translate(30, 30)" opacity="0.6">
    <circle cx="0" cy="0" r="8" fill="none" stroke="#10B981" stroke-width="2"/>
    <path d="M -3 -3 L 3 3 M -3 3 L 3 -3" stroke="#10B981" stroke-width="2"/>
  </g>
  
  <!-- Title -->
  <text x="100" y="190" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="600" fill="#374151">phaser-list-view</text>
</svg>