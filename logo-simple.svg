<?xml version="1.0" encoding="UTF-8"?>
<svg width="300" height="80" viewBox="0 0 300 80" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary gradient -->
    <linearGradient id="primary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Icon container -->
  <g id="icon">
    <!-- List container -->
    <rect x="10" y="15" width="50" height="50" rx="6" ry="6" fill="none" stroke="url(#primary)" stroke-width="2" opacity="0.3"/>
    
    <!-- List items -->
    <rect x="15" y="20" width="40" height="6" rx="3" ry="3" fill="url(#primary)" opacity="0.9"/>
    <rect x="15" y="30" width="35" height="6" rx="3" ry="3" fill="url(#primary)" opacity="0.8"/>
    <rect x="15" y="40" width="38" height="6" rx="3" ry="3" fill="url(#primary)" opacity="0.7"/>
    <rect x="15" y="50" width="32" height="6" rx="3" ry="3" fill="url(#primary)" opacity="0.6"/>
    
    <!-- Scroll indicator -->
    <rect x="62" y="25" width="2" height="15" rx="1" ry="1" fill="url(#accent)" opacity="0.8"/>
    
    <!-- Motion lines -->
    <line x1="68" y1="25" x2="78" y2="25" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.6"/>
    <line x1="68" y1="35" x2="75" y2="35" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.4"/>
    <line x1="68" y1="45" x2="80" y2="45" stroke="url(#accent)" stroke-width="1.5" stroke-linecap="round" opacity="0.5"/>
  </g>
  
  <!-- Text -->
  <g id="text">
    <text x="95" y="35" font-family="Arial, sans-serif" font-size="18" font-weight="600" fill="url(#primary)">
      phaser
    </text>
    <text x="95" y="55" font-family="Arial, sans-serif" font-size="20" font-weight="300" fill="#374151">
      list-view
    </text>
  </g>
</svg>