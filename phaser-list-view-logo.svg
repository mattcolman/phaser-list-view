<?xml version="1.0" encoding="UTF-8"?>
<svg width="400" height="400" version="1.1" viewBox="0 0 400 400" xmlns="http://www.w3.org/2000/svg">
 <defs>
  <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
   <stop offset="0%" style="stop-color:#00A4DC;stop-opacity:1" />
   <stop offset="100%" style="stop-color:#7B68EE;stop-opacity:1" />
  </linearGradient>
 </defs>
 <g transform="translate(0,-100)">
  <!-- Main circle background -->
  <circle cx="200" cy="300" r="180" fill="url(#grad1)"/>
  
  <!-- List items -->
  <g fill="#ffffff" transform="translate(120,220)">
    <!-- List item 1 -->
    <rect x="0" y="0" width="160" height="30" rx="4" opacity="0.9"/>
    <!-- List item 2 -->
    <rect x="0" y="40" width="160" height="30" rx="4" opacity="0.7"/>
    <!-- List item 3 -->
    <rect x="0" y="80" width="160" height="30" rx="4" opacity="0.5"/>
    <!-- List item 4 -->
    <rect x="0" y="120" width="160" height="30" rx="4" opacity="0.3"/>
  </g>
  
  <!-- Scroll indicator -->
  <rect x="300" y="220" width="8" height="160" rx="4" fill="#ffffff" opacity="0.3"/>
  <rect x="300" y="220" width="8" height="60" rx="4" fill="#ffffff" opacity="0.9"/>
  
  <!-- Phaser spark -->
  <path d="M 280,150 L 300,180 L 270,170 L 290,200 L 260,190 Z" fill="#FFD700" transform="rotate(15,280,175)"/>
</g>
</svg>