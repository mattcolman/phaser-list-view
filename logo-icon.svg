<?xml version="1.0" encoding="UTF-8"?>
<svg width="100" height="100" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Primary gradient -->
    <linearGradient id="iconPrimary" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4F46E5;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#7C3AED;stop-opacity:1" />
    </linearGradient>
    
    <!-- Accent gradient -->
    <linearGradient id="iconAccent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#06B6D4;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3B82F6;stop-opacity:1" />
    </linearGradient>
    
    <!-- Background gradient -->
    <radialGradient id="iconBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" style="stop-color:#F8FAFC;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#E2E8F0;stop-opacity:1" />
    </radialGradient>
  </defs>
  
  <!-- Background -->
  <rect width="100" height="100" rx="20" ry="20" fill="url(#iconBg)"/>
  
  <!-- Main container -->
  <rect x="20" y="20" width="60" height="60" rx="8" ry="8" fill="none" stroke="url(#iconPrimary)" stroke-width="2" opacity="0.3"/>
  
  <!-- List items -->
  <rect x="25" y="25" width="50" height="8" rx="4" ry="4" fill="url(#iconPrimary)" opacity="0.9"/>
  <rect x="25" y="37" width="42" height="8" rx="4" ry="4" fill="url(#iconPrimary)" opacity="0.8"/>
  <rect x="25" y="49" width="46" height="8" rx="4" ry="4" fill="url(#iconPrimary)" opacity="0.7"/>
  <rect x="25" y="61" width="38" height="8" rx="4" ry="4" fill="url(#iconPrimary)" opacity="0.6"/>
  
  <!-- Scroll indicator -->
  <rect x="82" y="30" width="3" height="20" rx="1.5" ry="1.5" fill="url(#iconAccent)" opacity="0.8"/>
  
  <!-- Motion effect -->
  <g opacity="0.6">
    <line x1="87" y1="30" x2="92" y2="30" stroke="url(#iconAccent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="87" y1="40" x2="90" y2="40" stroke="url(#iconAccent)" stroke-width="2" stroke-linecap="round"/>
    <line x1="87" y1="50" x2="93" y2="50" stroke="url(#iconAccent)" stroke-width="2" stroke-linecap="round"/>
  </g>
  
  <!-- Subtle "P" for Phaser in corner -->
  <text x="75" y="18" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="url(#iconPrimary)" opacity="0.7">P</text>
</svg>